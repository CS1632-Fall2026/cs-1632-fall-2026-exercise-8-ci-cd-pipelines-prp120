name: Maven CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  maven_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: zulu
          cache: maven
      - name: Test with Maven
        run: mvn -B test site
      - name: Upload test report as artifact
        uses: actions/upload-artifact@v6
        with:
          name: Test report
          path: target/site
      - name: Cache build
        uses: actions/cache@v5
        with:
          key: cached-build-${{ github.sha }}
          path: .

  update_dependence_graph:
    needs: [maven_test]
    # Pull requests, including Dependabot's, have a read-only token.
    # Submit the graph after the changes are pushed or merged to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Restore cached build
        uses: actions/cache@v5
        with:
          key: cached-build-${{ github.sha }}
          path: .
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: zulu
          cache: maven
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5
