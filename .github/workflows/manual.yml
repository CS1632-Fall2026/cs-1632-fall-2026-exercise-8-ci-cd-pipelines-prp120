name: Manual workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: Person to greet
        default: World
        required: true
        type: string

permissions:
  contents: read

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Send greeting
        env:
          GREETING_NAME: ${{ inputs.name }}
        run: echo "Hello $GREETING_NAME"
